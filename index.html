<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的记账本</title>
<style>
  :root {
    --income: #16a34a;      /* 收入 - 绿色 */
    --expense: #ef4444;     /* 支出 - 红色 */
    --primary: #6366f1;     /* 主色 - 紫蓝 */
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
    line-height: 1.5;
  }
  .wrap { max-width: 960px; margin: 0 auto; }

  /* 顶部标题和月份切换 */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  header h1 { font-size: 22px; font-weight: 700; }
  .month-nav { display: flex; align-items: center; gap: 8px; }
  .month-nav button {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 10px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
  }
  .month-nav button:hover { background: #f3f4f6; }
  #monthLabel { font-size: 17px; font-weight: 600; min-width: 100px; text-align: center; }

  /* 汇总卡片 */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .summary .card .label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .summary .card .value { font-size: 24px; font-weight: 700; }
  .summary .income .value { color: var(--income); }
  .summary .expense .value { color: var(--expense); }
  .summary .balance .value.plus { color: var(--income); }
  .summary .balance .value.minus { color: var(--expense); }

  /* 图表区 */
  .charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .charts h2, .form-card h2, .records h2 { font-size: 15px; margin-bottom: 14px; color: #374151; }
  .donut-box { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .donut-box svg { flex-shrink: 0; }
  .legend { flex: 1; min-width: 140px; }
  .legend .item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin-bottom: 8px;
  }
  .legend .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .legend .name { flex: 1; }
  .legend .amt { color: var(--muted); font-size: 12px; }
  .empty-tip { color: var(--muted); font-size: 13px; text-align: center; padding: 30px 0; }

  /* 柱状图 */
  .bar-chart { display: flex; align-items: flex-end; gap: 3px; height: 200px; padding-top: 10px; }
  .bar-day { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .bar-pair { display: flex; gap: 2px; align-items: flex-end; height: 100%; }
  .bar { width: 5px; border-radius: 3px 3px 0 0; min-height: 0; }
  .bar.in { background: var(--income); }
  .bar.out { background: var(--expense); }
  .bar-day .daylabel { font-size: 9px; color: var(--muted); margin-top: 4px; height: 12px; }
  .bar-legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; }
  .bar-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .bar-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  /* 记账表单 + 明细 两栏 */
  .bottom { display: grid; grid-template-columns: 380px 1fr; gap: 14px; align-items: start; }
  .form-card .field { margin-bottom: 12px; }
  .form-card label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 4px; }
  .type-toggle input { display: none; }
  .type-toggle label {
    flex: 1; text-align: center; padding: 9px 0; border-radius: 10px;
    border: 1px solid var(--border); cursor: pointer; font-size: 14px; color: var(--muted);
  }
  .type-toggle input:checked + label.out { background: #fee2e2; border-color: #fca5a5; color: var(--expense); font-weight: 600; }
  .type-toggle input:checked + label.in { background: #dcfce7; border-color: #86efac; color: var(--income); font-weight: 600; }
  input[type=number], input[type=date], input[type=text], select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; font-family: inherit;
  }
  input:focus, select:focus { outline: none; border-color: var(--primary); }
  .btn-save {
    width: 100%; background: var(--primary); color: #fff; border: none;
    padding: 12px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .btn-save:hover { background: #4f46e5; }

  .records .record {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--border);
  }
  .records .record:last-child { border-bottom: none; }
  .record .icon { font-size: 22px; width: 40px; height: 40px; background: #f3f4f6; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
  .record .info { flex: 1; min-width: 0; }
  .record .info .top { display: flex; align-items: baseline; gap: 8px; }
  .record .info .cat { font-weight: 600; font-size: 14px; }
  .record .info .date { font-size: 12px; color: var(--muted); }
  .record .info .note { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .record .amount { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .record .amount.income { color: var(--income); }
  .record .amount.expense { color: var(--expense); }
  .record .del {
    border: none; background: none; color: #cbd5e1; cursor: pointer; font-size: 18px;
    padding: 4px 6px; border-radius: 8px;
  }
  .record .del:hover { color: var(--expense); background: #fee2e2; }

  .records-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .records-head h2 { margin-bottom: 0; }
  .link-btn {
    border: 1px solid var(--border); background: #fff; border-radius: 8px;
    padding: 5px 10px; font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .link-btn:hover { background: #f3f4f6; }

  @media (max-width: 720px) {
    .summary, .charts, .bottom { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📒 我的记账本</h1>
    <div class="month-nav">
      <button id="prevBtn">‹ 上月</button>
      <span id="monthLabel">本月</span>
      <button id="nextBtn">下月 ›</button>
      <button id="todayBtn">回到本月</button>
    </div>
  </header>

  <section class="summary">
    <div class="card income"><div class="label">本月收入</div><div class="value" id="sumIncome">¥0.00</div></div>
    <div class="card expense"><div class="label">本月支出</div><div class="value" id="sumExpense">¥0.00</div></div>
    <div class="card balance"><div class="label">本月结余</div><div class="value plus" id="sumBalance">¥0.00</div></div>
  </section>

  <section class="charts">
    <div class="card">
      <h2>🍩 支出分类</h2>
      <div id="donutArea"></div>
    </div>
    <div class="card">
      <h2>📊 每日收支</h2>
      <div id="barArea"></div>
    </div>
  </section>

  <section class="bottom">
    <div class="card form-card">
      <h2>✏️ 记一笔</h2>
      <div class="field">
        <div class="type-toggle">
          <input type="radio" name="type" id="typeOut" value="expense" checked>
          <label for="typeOut" class="out">支出</label>
          <input type="radio" name="type" id="typeIn" value="income">
          <label for="typeIn" class="in">收入</label>
        </div>
      </div>
      <div class="field">
        <label>金额（元）</label>
        <input type="number" id="amountInput" step="0.01" min="0" placeholder="例如 35.5">
      </div>
      <div class="field">
        <label>分类</label>
        <select id="categorySelect"></select>
      </div>
      <div class="field">
        <label>日期</label>
        <input type="date" id="dateInput">
      </div>
      <div class="field">
        <label>备注（可不填）</label>
        <input type="text" id="noteInput" placeholder="例如：和朋友吃饭">
      </div>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>

    <div class="card records">
      <div class="records-head">
        <h2>📋 账单明细</h2>
        <button class="link-btn" id="exportBtn">导出 CSV</button>
      </div>
      <div id="recordsList"></div>
    </div>
  </section>
</div>

<script>
(function () {
  // ---------- 分类配置 ----------
  var CATEGORIES = {
    expense: [
      { id: 'food',      name: '餐饮', icon: '🍜', color: '#f59e0b' },
      { id: 'transport', name: '交通', icon: '🚗', color: '#3b82f6' },
      { id: 'shopping',  name: '购物', icon: '🛒', color: '#ec4899' },
      { id: 'housing',   name: '居住', icon: '🏠', color: '#8b5cf6' },
      { id: 'medical',   name: '医疗', icon: '💊', color: '#ef4444' },
      { id: 'study',     name: '学习', icon: '📚', color: '#06b6d4' },
      { id: 'fun',       name: '娱乐', icon: '🎮', color: '#f97316' },
      { id: 'comm',      name: '通讯', icon: '📱', color: '#10b981' },
      { id: 'social',    name: '人情', icon: '🎁', color: '#e11d48' },
      { id: 'other',     name: '其他', icon: '🧾', color: '#64748b' }
    ],
    income: [
      { id: 'salary',   name: '工资', icon: '💰', color: '#16a34a' },
      { id: 'bonus',    name: '奖金', icon: '🎯', color: '#22c55e' },
      { id: 'invest',   name: '理财', icon: '📈', color: '#0ea5e9' },
      { id: 'gift',     name: '红包', icon: '🧧', color: '#f43f5e' },
      { id: 'other',    name: '其他', icon: '🧾', color: '#64748b' }
    ]
  };

  function findCategory(type, id) {
    for (var i = 0; i < CATEGORIES[type].length; i++) {
      if (CATEGORIES[type][i].id === id) return CATEGORIES[type][i];
    }
    return CATEGORIES[type][CATEGORIES[type].length - 1];
  }

  // ---------- 数据存取 ----------
  var STORE_KEY = 'ledger_records_v1';
  var records = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* 忽略 */ }
    return [];
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
    } catch (e) {
      alert('数据保存失败：浏览器可能禁止了本地存储。请用 Chrome 或 Edge 浏览器打开本文件。');
    }
  }

  // ---------- 工具函数 ----------
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmt(n) {
    return '¥' + n.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function daysInMonth(ym) {
    var parts = ym.split('-');
    return new Date(parseInt(parts[0]), parseInt(parts[1]), 0).getDate();
  }

  // ---------- 状态 ----------
  var currentMonth = todayStr().slice(0, 7); // 例如 "2026-10"

  // 当前月份的记录
  function monthRecords() {
    return records.filter(function (r) { return r.date.slice(0, 7) === currentMonth; });
  }

  // ---------- 渲染 ----------
  var $ = function (id) { return document.getElementById(id); };

  function renderMonthLabel() {
    var parts = currentMonth.split('-');
    $('monthLabel').textContent = parts[0] + ' 年 ' + parseInt(parts[1]) + ' 月';
  }

  function renderSummary() {
    var list = monthRecords();
    var income = 0, expense = 0;
    list.forEach(function (r) {
      if (r.type === 'income') income += r.amount; else expense += r.amount;
    });
    $('sumIncome').textContent = fmt(income);
    $('sumExpense').textContent = fmt(expense);
    var bal = income - expense;
    var balEl = $('sumBalance');
    balEl.textContent = (bal < 0 ? '-' : '') + fmt(Math.abs(bal));
    balEl.className = 'value ' + (bal >= 0 ? 'plus' : 'minus');
  }

  function renderDonut() {
    var list = monthRecords().filter(function (r) { return r.type === 'expense'; });
    var total = 0;
    var group = {};
    list.forEach(function (r) {
      total += r.amount;
      group[r.category] = (group[r.category] || 0) + r.amount;
    });

    var area = $('donutArea');
    if (total <= 0) {
      area.innerHTML = '<div class="empty-tip">这个月还没有支出记录<br>记一笔支出后，这里会出现饼图</div>';
      return;
    }

    // 按金额从大到小排序
    var keys = Object.keys(group).sort(function (a, b) { return group[b] - group[a]; });
    var r = 58, cx = 70, cy = 70, sw = 24;
    var circ = 2 * Math.PI * r;
    var offset = 0, segs = '';
    keys.forEach(function (k) {
      var frac = group[k] / total;
      var len = frac * circ;
      var c = findCategory('expense', k);
      segs += '<circle r="' + r + '" cx="' + cx + '" cy="' + cy + '" fill="none" stroke="' + c.color +
        '" stroke-width="' + sw + '" stroke-dasharray="' + len + ' ' + (circ - len) +
        '" stroke-dashoffset="' + (-offset) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')" stroke-linecap="butt"></circle>';
      offset += len;
    });

    var legend = '';
    keys.forEach(function (k) {
      var c = findCategory('expense', k);
      var pct = (group[k] / total * 100).toFixed(1);
      legend += '<div class="item"><span class="dot" style="background:' + c.color + '"></span>' +
        '<span class="name">' + c.icon + ' ' + c.name + '</span>' +
        '<span class="amt">' + fmt(group[k]) + ' · ' + pct + '%</span></div>';
    });

    area.innerHTML =
      '<div class="donut-box">' +
        '<svg width="140" height="140" viewBox="0 0 140 140">' +
          '<circle r="' + r + '" cx="' + cx + '" cy="' + cy + '" fill="none" stroke="#f1f3f5" stroke-width="' + sw + '"></circle>' +
          segs +
          '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" font-size="12" fill="#6b7280">总支出</text>' +
          '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">' + fmt(total) + '</text>' +
        '</svg>' +
        '<div class="legend">' + legend + '</div>' +
      '</div>';
  }

  function renderBars() {
    var days = daysInMonth(currentMonth);
    var perDay = [];
    for (var i = 1; i <= days; i++) perDay[i] = { income: 0, expense: 0 };
    monthRecords().forEach(function (r) {
      var day = parseInt(r.date.slice(8, 10));
      if (perDay[day]) {
        if (r.type === 'income') perDay[day].income += r.amount; else perDay[day].expense += r.amount;
      }
    });

    var max = 1;
    for (var d = 1; d <= days; d++) {
      max = Math.max(max, perDay[d].income, perDay[d].expense);
    }

    var html = '';
    for (var d2 = 1; d2 <= days; d2++) {
      var hIn = Math.round(perDay[d2].income / max * 150);
      var hOut = Math.round(perDay[d2].expense / max * 150);
      var showLabel = (d2 === 1 || d2 % 5 === 0 || d2 === days);
      html += '<div class="bar-day">' +
        '<div class="bar-pair">' +
          '<div class="bar in" style="height:' + hIn + 'px" title="' + d2 + '日 收入 ' + fmt(perDay[d2].income) + '"></div>' +
          '<div class="bar out" style="height:' + hOut + 'px" title="' + d2 + '日 支出 ' + fmt(perDay[d2].expense) + '"></div>' +
        '</div>' +
        '<div class="daylabel">' + (showLabel ? d2 : '') + '</div>' +
      '</div>';
    }

    $('barArea').innerHTML =
      '<div class="bar-chart">' + html + '</div>' +
      '<div class="bar-legend">' +
        '<span><i style="background:#16a34a"></i>收入</span>' +
        '<span><i style="background:#ef4444"></i>支出</span>' +
      '</div>';
  }

  function renderRecords() {
    var list = monthRecords().slice().sort(function (a, b) {
      return a.date === b.date ? b.id - a.id : (a.date < b.date ? 1 : -1);
    });
    var box = $('recordsList');
    if (list.length === 0) {
      box.innerHTML = '<div class="empty-tip">这个月还没有账单<br>在左边「记一笔」里添加吧</div>';
      return;
    }
    var html = '';
    list.forEach(function (r) {
      var c = findCategory(r.type, r.category);
      var cls = r.type === 'income' ? 'income' : 'expense';
      var sign = r.type === 'income' ? '+' : '-';
      html += '<div class="record">' +
        '<div class="icon">' + c.icon + '</div>' +
        '<div class="info">' +
          '<div class="top"><span class="cat">' + c.name + '</span><span class="date">' + r.date + '</span></div>' +
          (r.note ? '<div class="note">' + escapeHtml(r.note) + '</div>' : '') +
        '</div>' +
        '<div class="amount ' + cls + '">' + sign + fmt(r.amount) + '</div>' +
        '<button class="del" data-id="' + r.id + '" title="删除">✕</button>' +
      '</div>';
    });
    box.innerHTML = html;

    // 绑定删除
    box.querySelectorAll('.del').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var id = parseInt(btn.getAttribute('data-id'));
        if (confirm('确定删除这条记录吗？')) {
          records = records.filter(function (r) { return r.id !== id; });
          save(); renderAll();
        }
      });
    });
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderCategoryOptions() {
    var type = document.querySelector('input[name=type]:checked').value;
    var sel = $('categorySelect');
    sel.innerHTML = '';
    CATEGORIES[type].forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.icon + ' ' + c.name;
      sel.appendChild(opt);
    });
  }

  function renderAll() {
    renderMonthLabel();
    renderSummary();
    renderDonut();
    renderBars();
    renderRecords();
  }

  // ---------- 事件 ----------
  $('prevBtn').addEventListener('click', function () {
    var p = currentMonth.split('-');
    var y = parseInt(p[0]), m = parseInt(p[1]) - 1;
    if (m === 0) { y--; m = 12; }
    currentMonth = y + '-' + pad(m);
    renderAll();
  });
  $('nextBtn').addEventListener('click', function () {
    var p = currentMonth.split('-');
    var y = parseInt(p[0]), m = parseInt(p[1]) + 1;
    if (m === 13) { y++; m = 1; }
    currentMonth = y + '-' + pad(m);
    renderAll();
  });
  $('todayBtn').addEventListener('click', function () {
    currentMonth = todayStr().slice(0, 7);
    renderAll();
  });

  // 切换类型时更新分类下拉框
  document.querySelectorAll('input[name=type]').forEach(function (radio) {
    radio.addEventListener('change', renderCategoryOptions);
  });

  $('saveBtn').addEventListener('click', addRecord);
  $('noteInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addRecord();
  });

  function addRecord() {
    var type = document.querySelector('input[name=type]:checked').value;
    var amount = parseFloat($('amountInput').value);
    var category = $('categorySelect').value;
    var date = $('dateInput').value || todayStr();
    var note = $('noteInput').value.trim();

    if (!amount || amount <= 0 || isNaN(amount)) {
      alert('请输入正确的金额（大于 0 的数字）');
      $('amountInput').focus();
      return;
    }

    records.push({
      id: Date.now(),
      type: type,
      amount: Math.round(amount * 100) / 100,
      category: category,
      date: date,
      note: note
    });
    save();

    // 重置表单（保留日期和类型）
    $('amountInput').value = '';
    $('noteInput').value = '';

    // 跳到记录所在的月份，方便看到刚记的账
    currentMonth = date.slice(0, 7);
    renderAll();
    $('amountInput').focus();
  }

  // 导出 CSV
  $('exportBtn').addEventListener('click', function () {
    if (records.length === 0) { alert('还没有任何账单，无法导出'); return; }
    var lines = ['类型,金额,分类,日期,备注'];
    records.forEach(function (r) {
      var c = findCategory(r.type, r.category);
      var typeName = r.type === 'income' ? '收入' : '支出';
      lines.push([typeName, r.amount, c.name, r.date, '"' + (r.note || '') + '"'].join(','));
    });
    var blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '账单_' + currentMonth + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // ---------- 初始化 ----------
  $('dateInput').value = todayStr();
  renderCategoryOptions();
  renderAll();
})();
</script>
</body>
</html>
